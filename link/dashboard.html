<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard — alternate.lol/link</title>
    <link rel="stylesheet" href="dashboard.css">
    <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@300;400;500&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
<div class="app">
    <!-- Sidebar -->
    <aside class="side">
        <div class="side-logo"><a href="/">/alternate</a></div>
        <nav class="side-nav">
            <button class="sn active" data-p="profile"><i class="fas fa-user"></i>Profile</button>
            <button class="sn" data-p="style"><i class="fas fa-palette"></i>Style</button>
            <button class="sn" data-p="links"><i class="fas fa-link"></i>Links</button>
            <button class="sn" data-p="media"><i class="fas fa-music"></i>Media</button>
            <button class="sn" data-p="integrations"><i class="fas fa-plug"></i>Integrations</button>
            <button class="sn" data-p="effects"><i class="fas fa-sparkles"></i>Effects</button>
            <button class="sn" data-p="seo"><i class="fas fa-chart-simple"></i>Analytics</button>
        </nav>
        <div class="side-foot">
            <button class="sf save" id="saveBtn"><i class="fas fa-save"></i>Save</button>
            <button class="sf" id="logoutBtn"><i class="fas fa-sign-out-alt"></i>Logout</button>
        </div>
    </aside>

    <!-- Content -->
    <main class="main">
        <!-- Profile -->
        <section class="panel active" id="p-profile">
            <h2>Profile</h2>
            <div class="card"><label>Display Name<input type="text" id="f-display_name"></label></div>
            <div class="card"><label>Bio<textarea id="f-bio" rows="3"></textarea></label></div>
            <div class="card two"><label>Pronouns<input type="text" id="f-pronouns"></label><label>Location<input type="text" id="f-location"></label></div>
            <div class="card"><label>Avatar<div class="upload" id="avatarUpload"><i class="fas fa-camera"></i><span>Upload</span><input type="file" accept="image/*" hidden></div></label></div>
            <div class="card">
                <label>Avatar Effects <small>(max 2)</small></label>
                <div class="chips multi" id="avatarFx" data-max="2">
                    <button data-v="rainbow">🌈 Rainbow</button><button data-v="shine">✨ Shine</button>
                    <button data-v="glow">💡 Glow</button><button data-v="pulse">💜 Pulse</button>
                    <button data-v="border">🔲 Border</button><button data-v="spin">🔄 Spin</button>
                </div>
            </div>
            <div class="card">
                <label>Name Effect</label>
                <div class="chips single" id="nameFx">
                    <button class="on" data-v="none">None</button><button data-v="gradient">Gradient</button>
                    <button data-v="glow">Glow</button><button data-v="animated">Animated</button>
                </div>
            </div>
        </section>

        <!-- Style -->
        <section class="panel" id="p-style">
            <h2>Appearance</h2>
            <div class="card"><label>Card Style</label>
                <div class="chips single" id="cardStyle">
                    <button class="on" data-v="compact">Compact</button><button data-v="full">Full</button>
                    <button data-v="horizontal">Horizontal</button><button data-v="minimal">Minimal</button>
                </div>
            </div>
            <div class="card"><label>Background Type<select id="f-background_type"><option>video</option><option>image</option><option>gif</option><option>color</option><option>gradient</option></select></label></div>
            <div class="card"><label>Background File<div class="upload" id="bgUpload"><i class="fas fa-film"></i><span>Upload (MP4/PNG/GIF)</span><input type="file" accept="video/mp4,image/*" hidden></div></label></div>
            <div class="card"><label>Overlay Opacity<input type="range" min="0" max="100" value="60" id="f-card_opacity"><span class="rv">60%</span></label></div>
            <div class="card"><label>Background Blur<input type="range" min="0" max="20" value="2" id="f-card_blur_bg"><span class="rv">2px</span></label></div>
            <div class="card two"><label>Accent Color<input type="color" value="#ff6b8a" id="f-accent_color"></label><label>Card BG<input type="color" value="#0d0d0f" id="f-card_bg"></label></div>
            <div class="card"><label>Card Blur<input type="range" min="0" max="30" value="16" id="f-card_blur"><span class="rv">16px</span></label></div>
            <div class="card"><label>Card Radius<input type="range" min="0" max="32" value="16" id="f-card_radius"><span class="rv">16px</span></label></div>
            <div class="card"><label>Font<select id="f-font_family"><option>Inter</option><option>Geist Mono</option><option>monospace</option><option>system-ui</option></select></label></div>
            <div class="card"><label>Custom CSS<textarea id="f-custom_css" rows="4" class="code"></textarea></label></div>
        </section>

        <!-- Links -->
        <section class="panel" id="p-links">
            <h2>Social Links & Buttons</h2>
            <div class="card"><label>Social Icons</label><div id="socialList" class="link-list"></div><button class="add-btn" id="addSocial"><i class="fas fa-plus"></i> Add</button></div>
            <div class="card"><label>Buttons</label><div id="btnList" class="link-list"></div><button class="add-btn" id="addBtn"><i class="fas fa-plus"></i> Add</button></div>
        </section>

        <!-- Media -->
        <section class="panel" id="p-media">
            <h2>Audio & Cursor</h2>
            <div class="card"><label>Music<div class="toggle-row"><span>Enable</span><input type="checkbox" id="f-music_enabled"></div></label></div>
            <div class="card"><label>Source<select id="f-music_source"><option value="file">Upload MP3</option><option value="spotify">Spotify URL</option><option value="soundcloud">SoundCloud</option><option value="url">Direct URL</option></select></label></div>
            <div class="card"><label>Music File<div class="upload" id="musicUpload"><i class="fas fa-headphones"></i><span>Upload MP3</span><input type="file" accept="audio/*" hidden></div></label></div>
            <div class="card two"><label>Song Title<input type="text" id="f-song_title"></label><label>Artist<input type="text" id="f-song_artist"></label></div>
            <div class="card"><label>Volume<input type="range" min="0" max="100" value="50" id="f-music_volume"><span class="rv">50%</span></label></div>
            <div class="card"><label>Cursor<select id="f-cursor_type"><option>ring</option><option>dot</option><option>crosshair</option><option>custom</option><option>none</option></select></label></div>
            <div class="card two"><label>Click Sound<select id="f-click_sound"><option>none</option><option>pop</option><option>click</option><option>soft</option></select></label><label>Hover Sound<select id="f-hover_sound"><option>none</option><option>tick</option><option>swoosh</option></select></label></div>
        </section>

        <!-- Integrations -->
        <section class="panel" id="p-integrations">
            <h2>Integrations</h2>
            <div class="card"><h3><i class="fab fa-discord"></i> Discord</h3><div class="toggle-row"><span>Enable</span><input type="checkbox" id="f-discord_enabled"></div><label>User ID<input type="text" id="f-discord_id"></label></div>
            <div class="card"><h3><i class="fab fa-spotify"></i> Spotify / Last.fm</h3><div class="toggle-row"><span>Enable</span><input type="checkbox" id="f-spotify_enabled"></div><label>Source<select id="f-spotify_source"><option>lastfm</option><option>spotify</option></select></label><label>Username<input type="text" id="f-spotify_username"></label><label>Style<select id="f-spotify_style"><option>card</option><option>bar</option><option>minimal</option></select></label></div>
            <div class="card"><h3><i class="fas fa-gamepad"></i> Roblox</h3><div class="toggle-row"><span>Enable</span><input type="checkbox" id="f-roblox_enabled"></div><label>Username/ID<input type="text" id="f-roblox_username"></label></div>
        </section>

        <!-- Effects -->
        <section class="panel" id="p-effects">
            <h2>Effects</h2>
            <div class="card"><label>Particles<select id="f-particle_type"><option>none</option><option>snow</option><option>stars</option><option>fireflies</option><option>rain</option><option>matrix</option></select></label></div>
            <div class="card"><label>Count<input type="range" min="10" max="200" value="50" id="f-particle_count"><span class="rv">50</span></label></div>
            <div class="card"><label>Overlay<select id="f-overlay_type"><option>none</option><option>vignette</option><option>scanlines</option><option>noise</option><option>crt</option></select></label></div>
            <div class="card"><label>Card Animation<select id="f-card_animation"><option>fadeUp</option><option>fadeIn</option><option>slideLeft</option><option>scale</option><option>glitch</option></select></label></div>
            <div class="card">
                <div class="toggle-row"><span>3D Tilt</span><input type="checkbox" id="f-tilt_enabled" checked></div>
                <div class="toggle-row"><span>Glow</span><input type="checkbox" id="f-glow_enabled"></div>
                <div class="toggle-row"><span>Glitch</span><input type="checkbox" id="f-glitch_enabled"></div>
                <div class="toggle-row"><span>Typewriter Bio</span><input type="checkbox" id="f-typewriter_bio"></div>
                <div class="toggle-row"><span>Light Rays</span><input type="checkbox" id="f-light_rays"></div>
            </div>
        </section>

        <!-- Analytics -->
        <section class="panel" id="p-seo">
            <h2>Analytics & SEO</h2>
            <div class="stats" id="statsGrid">
                <div class="stat-box"><span class="sn">0</span><span class="sl">Views</span></div>
                <div class="stat-box"><span class="sn">0</span><span class="sl">Clicks</span></div>
                <div class="stat-box"><span class="sn">0</span><span class="sl">Today</span></div>
                <div class="stat-box"><span class="sn">0</span><span class="sl">This Week</span></div>
            </div>
            <div class="card"><label>Page Title<input type="text" id="f-page_title"></label></div>
            <div class="card"><label>Meta Description<textarea id="f-meta_description" rows="2"></textarea></label></div>
            <div class="card"><label>Embed Color<input type="color" value="#ff6b8a" id="f-theme_color"></label></div>
        </section>
    </main>
</div>
<script src="dashboard.js"></script>
</body>
</html>
