<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>alternate.lol/link</title>
    <link rel="stylesheet" href="link.css">
    <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@300;400;500&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
    <!-- This is the LANDING page (not logged in) -->
    <!-- Shows: checkered bg, alias checker, pricing, login -->

    <div class="bg-checker"></div>
    <div class="glow g1"></div>
    <div class="glow g2"></div>

    <main class="landing">
        <div class="land-card">
            <div class="land-logo">/alternate<span>.lol/link</span></div>
            <p class="land-sub">Custom profile cards for the community</p>

            <div class="alias-wrap">
                <span class="alias-pre">alternate.lol/</span>
                <input type="text" id="aliasIn" placeholder="username" maxlength="20" autocomplete="off">
                <span class="alias-res" id="aliasRes"></span>
            </div>

            <div class="land-users" id="recentUsers"></div>

            <div class="land-pricing">
                <div class="price"><span>$20</span><small>lifetime</small></div>
                <div class="price"><span>$10</span><small>2 months</small></div>
            </div>

            <div class="land-btns">
                <a href="#" class="btn-pink" data-external="https://discord.com/channels/1499128437074300940/1522493351700729866">Purchase</a>
                <button class="btn-outline" id="loginOpen">Login</button>
            </div>
        </div>
    </main>

    <!-- Login Modal -->
    <div class="modal" id="modal">
        <div class="modal-box">
            <button class="modal-x" id="modalClose">×</button>
            <h2>Login</h2>
            <form id="loginForm">
                <label>Username<input type="text" id="lUser" required></label>
                <label>Password<input type="password" id="lPass" required></label>
                <p class="err" id="lErr"></p>
                <button type="submit" class="btn-pink w-full">Login</button>
            </form>
        </div>
    </div>

    <script src="link.js"></script>
</body>
</html>
