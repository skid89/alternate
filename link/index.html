<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>alternate.lol/link</title>
    <link rel="stylesheet" href="link.css">
    <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@300;400;500&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
    <div class="bg-layer"><div class="bg-checker"></div></div>
    <div class="cursor" id="cursor"></div>

    <main class="landing">
        <div class="landing-card" id="linkCard">
            <h1 class="landing-title">/alternate<span>.lol/link</span></h1>
            <p class="landing-sub">Custom profile cards for the community</p>

            <!-- Alias checker -->
            <div class="alias-box">
                <span class="alias-pre">alternate.lol/</span>
                <input type="text" id="aliasInput" placeholder="yourname" maxlength="20">
                <span class="alias-result" id="aliasResult"></span>
            </div>

            <!-- Recent users -->
            <div class="recent-section">
                <p class="recent-label">alternate.lol users:</p>
                <div class="recent-list" id="recentUsers">
                    <div class="recent-user"><span>Loading...</span></div>
                </div>
            </div>

            <!-- Pricing -->
            <div class="pricing">
                <div class="price-item"><span class="price-amount">$20</span><span class="price-label">lifetime</span></div>
                <div class="price-item"><span class="price-amount">$10</span><span class="price-label">2 months</span></div>
            </div>

            <!-- Actions -->
            <div class="landing-btns">
                <a href="#" class="btn-pink" data-external="https://discord.com/channels/1499128437074300940/1522493351700729866">Purchase (Open Ticket)</a>
                <button class="btn-ghost" id="loginBtn">Login</button>
            </div>
        </div>
    </main>

    <!-- Login Modal -->
    <div class="modal" id="loginModal">
        <div class="modal-card">
            <h2>Login</h2>
            <form id="loginForm">
                <div class="field"><label>Username</label><input type="text" id="loginUser" required></div>
                <div class="field"><label>Password</label><input type="password" id="loginPass" required></div>
                <p class="form-error" id="loginError"></p>
                <button type="submit" class="btn-pink" style="width:100%">Login</button>
                <button type="button" class="btn-ghost" id="closeLogin" style="width:100%;margin-top:8px">Cancel</button>
            </form>
        </div>
    </div>

    <script src="link.js"></script>
</body>
</html>
