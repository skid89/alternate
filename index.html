      <div id="gui-card">
        <!-- Premium OS-Style Window Top Bar -->

      </div>

  <!-- FEATURES MODAL -->

    <div class="modal-container">
      <div class="modal-header">
        <h2>Script Features</h2>
        <button class="modal-close" aria-label="Close modal">&times;</button>
      </div>
      <div class="modal-body custom-scrollbar">
        <div id="features-loader" class="modal-loader">
          <div class="spinner"></div>
          <p>Loading features from script.txt...</p>
        </div>
        <div id="features-content" class="features-grid"></div>
      </div>
    </div>
  </div>

  <!-- INFO MODAL -->
  <div id="modal-info" class="modal">
    <div class="modal-overlay"></div>
    <div class="modal-container info-container">
      <div class="modal-header">
        <h2>Product Information</h2>
        <button class="modal-close" aria-label="Close modal">&times;</button>
      </div>
      <div class="modal-body custom-scrollbar info-layout">
        
        <!-- Supported Games Section -->
        <div class="info-section">
          <h3>Supported Games</h3>
          <div id="games-list" class="games-grid">
            <!-- Dynamically populated -->
          </div>
        </div>

        <!-- Supported Executors Section -->
        <div class="info-section">
          <h3>Supported Executors</h3>
          <div id="executors-list" class="executors-flex">
            <!-- Dynamically populated -->
          </div>
        </div>

        <!-- Owner / Developer Section -->
        <div class="info-section owner-section">
          <h3>Developer Profile</h3>
          <div class="owner-card">
            <div class="owner-avatar-container">
              <img id="owner-avatar" src="" alt="Developer Avatar" class="owner-avatar">

                <span class="stat-badge">Created: <span id="owner-created">05/01/2025</span></span>
                <span class="stat-badge status-online">Status: Active</span>
              </div>
              <div class="owner-links-container">
                <h5>Contact & Links</h5>
                <div id="owner-links" class="owner-links-grid">
                  <!-- Dynamically populated -->
                </div>
              </div>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>

  <!-- Javascript Modules -->
  <script src="src/config.js"></script>
  <script src="src/app.js"></script>
